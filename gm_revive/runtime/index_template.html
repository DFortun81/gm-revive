<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root { --bg: #111; --fg: #eee; --panel: rgba(10, 12, 20, 0.94); --accent: #6aa8ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #wrap { position: relative; }
  #gm-canvas { display: block; image-rendering: pixelated; max-width: 100vw; max-height: 100vh; width: auto; height: auto;
               aspect-ratio: 4 / 3; cursor: default; }
  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
  #gm-start { background: rgba(0, 0, 0, 0.75); cursor: pointer; }
  #gm-start h1 { margin: 0; font-size: 28px; }
  #gm-start p { margin: 0; opacity: 0.8; }
  #gm-start button { font-size: 18px; padding: 10px 28px; border-radius: 6px; border: 0; background: var(--accent); color: #000; cursor: pointer; }
  #bar { width: 320px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
  #bar > div { height: 100%; width: 0; background: var(--accent); }
  #gm-info { display: none; position: absolute; inset: 20px; overflow: auto; background: var(--panel); color: #fff;
             padding: 20px 28px; border: 1px solid #456; border-radius: 6px; font-family: Arial, sans-serif; line-height: 1.35; }
  #gm-info .close { position: sticky; top: 0; float: right; cursor: pointer; background: #345; color: #fff; border: 0; padding: 4px 10px; border-radius: 4px; }
  #gm-error { display: none; position: absolute; left: 0; right: 0; bottom: 0; max-height: 40%; overflow: auto; margin: 0;
              background: rgba(120, 0, 0, 0.9); color: #fff; font: 12px monospace; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gm-canvas" width="800" height="600"></canvas>
  <div id="gm-start" class="overlay">
    <h1>{{TITLE}}</h1>
    <div id="bar"><div></div></div>
    <p id="gm-status">Loading…</p>
    <button id="gm-play" hidden>Play</button>
  </div>
  <div id="gm-info"><button class="close" onclick="this.parentNode.style.display='none'">Close</button>{{INFO}}</div>
  <pre id="gm-error"></pre>
</div>
<script src="images.js"></script>
<script src="runtime.js"></script>
<script src="game.js"></script>
<script>
(async () => {
  const bar = document.querySelector('#bar > div'), status = document.getElementById('gm-status');
  try {
    await B._load(p => { bar.style.width = (p * 100).toFixed(0) + '%'; });
  } catch (e) {
    status.textContent = 'Failed to load assets: ' + e.message +
      (location.protocol === 'file:' ? ' — open this page through a local web server (see README).' : '');
    return;
  }
  bar.style.width = '100%';
  status.textContent = 'Ready';
  const btn = document.getElementById('gm-play'); btn.hidden = false;
  const start = () => {
    document.getElementById('gm-start').remove();
    __init_constants(B._DUMMY, B._DUMMY);
    B._start();
  };
  document.getElementById('gm-start').addEventListener('click', start, { once: true });
  if (new URLSearchParams(location.search).has('autostart')) start();
})();
</script>
</body>
</html>
